<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno Electrónica - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Elementos decorativos de fondo (ondas/luces tecnológicas) -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Contenedor Principal de Logeo -->
    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/50 p-8 space-y-6 relative z-10 animate-fade-in">
        
        <!-- Encabezado / Logo -->
        <div class="text-center space-y-2">
            <a href="index.html" class="inline-block group focus:outline-none" title="Volver al inicio">
                <div class="mx-auto w-14 h-14 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-bell text-white text-2xl animate-bounce" style="animation-duration: 3s;"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight pt-2 group-hover:text-blue-400 transition-colors">Tecno Electrónica</h1>
            </a>
            <p class="text-sm text-slate-400">Gestión de Automatización Escolar</p>
        </div>

        <!-- Formulario -->
        <form class="space-y-5" action="#" method="POST">
            
            <!-- Campo: Email/Usuario -->
            <div class="space-y-1">
                <label for="email" class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">Correo Institucional</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" autocomplete="email"
                        class="w-full bg-slate-900/50 text-white placeholder-slate-500 text-sm rounded-xl pl-10 pr-4 py-3 border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
                        placeholder="ejemplo@colegio.edu.ar">
                </div>
            </div>

            <!-- Campo: Contraseña -->
            <div class="space-y-1">
                <div class="flex items-center justify-between">
                    <label for="password" class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">Contraseña</label>
                    <a href="#" class="text-xs font-medium text-blue-400 hover:text-blue-300 transition-colors">¿La olvidaste?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        class="w-full bg-slate-900/50 text-white placeholder-slate-500 text-sm rounded-xl pl-10 pr-10 py-3 border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
                        placeholder="••••••••••••">
                    <!-- Botón para mostrar/ocultar clave (Requiere lógica JS posterior) -->
                    <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-300">
                        <i class="fa-solid fa-eye-slash" id="togglePassword"></i>
                    </button>
                </div>
            </div>

            <!-- Opciones extra: Recordarme -->
            <div class="flex items-center">
                <input id="remember-me" name="remember-me" type="checkbox"
                    class="h-4 w-4 rounded bg-slate-900 border-slate-700 text-blue-500 focus:ring-blue-500/20 focus:ring-offset-slate-800 focus:ring-2">
                <label for="remember-me" class="ml-2 block text-sm text-slate-400 select-none cursor-pointer">
                    Mantener sesión iniciada
                </label>
            </div>

            <!-- Botón de Envío -->
            <button type="button" onclick="window.location.href='panel/panel.html';"
                class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-medium text-sm rounded-xl py-3 shadow-lg shadow-blue-500/25 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-800 transition-all duration-150 transform active:scale-[0.98]">
                Ingresar al Panel <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
            </button>
        </form>

        <!-- Pie del Login -->
        <div class="pt-4 border-t border-slate-700/50 flex flex-col items-center space-y-2 text-xs text-slate-500">
            <p>© 2026 Tecno Electrónica. Todos los derechos reservados.</p>
            <div class="flex space-x-3">
                <a href="#" class="hover:text-slate-300 transition-colors">Soporte Técnico</a>
                <span>•</span>
                <a href="#" class="hover:text-slate-300 transition-colors">Términos de Uso</a>
            </div>
        </div>

    </div>

    <!-- Script básico opcional para alternar visibilidad de contraseña -->
    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');

        togglePasswordBtn.parentElement.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.classList.remove('fa-eye-slash');
                togglePasswordBtn.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.classList.remove('fa-eye');
                togglePasswordBtn.classList.add('fa-eye-slash');
            }
        });
    </script>
</body>
</html>
