<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <!-- Shadow effect for breadboard & components -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arduino Board Gradient -->
    <linearGradient id="arduinoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00979D"/>
      <stop offset="100%" stop-color="#005B60"/>
    </linearGradient>

    <!-- Breadboard Gradient -->
    <linearGradient id="breadboardBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- LED Red Gradient -->
    <radialGradient id="ledRedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- LED Green Gradient -->
    <radialGradient id="ledGreenGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
  </defs>

  <!-- Title & Header -->
  <text x="525" y="35" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold">VISTA DE MONTAJE EN PROTOBOARD (ESTILO TINKERCAD)</text>
  <text x="525" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Conexión física de transistores BC547C, resistencias y LEDs con Arduino Uno</text>

  <!-- Container Box -->
  <rect x="20" y="70" width="1010" height="630" fill="#111827" rx="14" stroke="#1e293b" stroke-width="2"/>

  <!-- ================================================================= -->
  <!-- 1. PLACA ARDUINO UNO (LADO IZQUIERDO) -->
  <!-- ================================================================= -->
  <g transform="translate(50, 120)" filter="url(#dropShadow)">
    <!-- Board Body -->
    <rect x="0" y="0" width="220" height="480" rx="12" fill="url(#arduinoBlue)" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="1">ARDUINO</text>
    <text x="110" y="60" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="600">UNO</text>

    <!-- USB Connector -->
    <rect x="-20" y="70" width="30" height="55" fill="#cbd5e1" rx="4" stroke="#475569" stroke-width="2"/>
    <rect x="-25" y="80" width="10" height="35" fill="#94a3b8" rx="2"/>
    <text x="-8" y="102" fill="#334155" font-size="9" font-weight="bold" transform="rotate(-90 -8 102)">USB</text>

    <!-- Power Jack -->
    <rect x="25" y="445" width="45" height="45" fill="#1e293b" rx="4" stroke="#0f172a" stroke-width="2"/>
    <circle cx="47" cy="467" r="8" fill="#475569"/>

    <!-- Microcontroller Chip (ATmega328P) -->
    <rect x="70" y="220" width="80" height="180" fill="#1e293b" rx="4" stroke="#090d16" stroke-width="2"/>
    <circle cx="85" cy="235" r="4" fill="#475569"/>
    <text x="110" y="315" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold" transform="rotate(-90 110 315)">ATMEGA328P-PU</text>

    <!-- Digital Header (Right Side Top) -->
    <rect x="190" y="90" width="22" height="200" fill="#0f172a" rx="3"/>
    <!-- Pins 0 to 13 -->
    <!-- Pin D2 (index 3 from top) -->
    <circle cx="201" cy="140" r="4.5" fill="#38bdf8"/>
    <text x="180" y="144" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold">D2</text>

    <!-- Pin D3 (index 4 from top) -->
    <circle cx="201" cy="160" r="4.5" fill="#a855f7"/>
    <text x="180" y="164" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold">D3</text>

    <!-- Power Header (Right Side Bottom) -->
    <rect x="190" y="320" width="22" height="130" fill="#0f172a" rx="3"/>
    <!-- 5V Pin -->
    <circle cx="201" cy="360" r="4.5" fill="#ef4444"/>
    <text x="180" y="364" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold">5V</text>

    <!-- GND Pin -->
    <circle cx="201" cy="390" r="4.5" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="180" y="394" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold">GND</text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. PROTOBOARD / BREADBOARD (LADO DERECHO) -->
  <!-- ================================================================= -->
  <g transform="translate(360, 110)" filter="url(#dropShadow)">
    <!-- Breadboard Main Base -->
    <rect x="0" y="0" width="630" height="500" rx="10" fill="url(#breadboardBody)" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Center Divider Channel -->
    <rect x="0" y="240" width="630" height="20" fill="#cbd5e1"/>

    <!-- Power Rails Lines (Top and Bottom) -->
    <!-- Top Positive (+) Red Line -->
    <line x1="30" y1="25" x2="600" y2="25" stroke="#ef4444" stroke-width="2.5"/>
    <text x="15" y="28" fill="#ef4444" font-size="14" font-weight="bold">+</text>

    <!-- Top Negative (-) Blue Line -->
    <line x1="30" y1="55" x2="600" y2="55" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="15" y="58" fill="#3b82f6" font-size="14" font-weight="bold">-</text>

    <!-- Bottom Positive (+) Red Line -->
    <line x1="30" y1="445" x2="600" y2="445" stroke="#ef4444" stroke-width="2.5"/>
    <text x="15" y="448" fill="#ef4444" font-size="14" font-weight="bold">+</text>

    <!-- Bottom Negative (-) Blue Line -->
    <line x1="30" y1="475" x2="600" y2="475" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="15" y="478" fill="#3b82f6" font-size="14" font-weight="bold">-</text>

    <!-- Row Numbers (1 to 30) -->
    <!-- We draw key pin hole grid indicators -->
    <g fill="#64748b" font-size="9" font-family="monospace">
      <text x="60" y="80">1</text>
      <text x="120" y="80">5</text>
      <text x="195" y="80">10</text>
      <text x="270" y="80">15</text>
      <text x="345" y="80">20</text>
      <text x="420" y="80">25</text>
      <text x="495" y="80">30</text>
    </g>

    <!-- Grid Holes Pattern (Simulated Breadboard matrix) -->
    <!-- Top Terminal Strip (Rows a,b,c,d,e -> y: 95 to 225) -->
    <!-- Bottom Terminal Strip (Rows f,g,h,i,j -> y: 275 to 405) -->

    <!-- Power Rail Holes -->
    <!-- Top (+) Rail Holes -->
    <g fill="#334155">
      <!-- Top (+) -->
      <circle cx="60" cy="25" r="3"/><circle cx="95" cy="25" r="3"/><circle cx="130" cy="25" r="3"/>
      <circle cx="165" cy="25" r="3"/><circle cx="200" cy="25" r="3"/><circle cx="235" cy="25" r="3"/>
      <circle cx="270" cy="25" r="3"/><circle cx="305" cy="25" r="3"/><circle cx="340" cy="25" r="3"/>
      <circle cx="375" cy="25" r="3"/><circle cx="410" cy="25" r="3"/><circle cx="445" cy="25" r="3"/>
      <circle cx="480" cy="25" r="3"/><circle cx="515" cy="25" r="3"/><circle cx="550" cy="25" r="3"/>

      <!-- Top (-) -->
      <circle cx="60" cy="55" r="3"/><circle cx="95" cy="55" r="3"/><circle cx="130" cy="55" r="3"/>
      <circle cx="165" cy="55" r="3"/><circle cx="200" cy="55" r="3"/><circle cx="235" cy="55" r="3"/>
      <circle cx="270" cy="55" r="3"/><circle cx="305" cy="55" r="3"/><circle cx="340" cy="55" r="3"/>
      <circle cx="375" cy="55" r="3"/><circle cx="410" cy="55" r="3"/><circle cx="445" cy="55" r="3"/>
      <circle cx="480" cy="55" r="3"/><circle cx="515" cy="55" r="3"/><circle cx="550" cy="55" r="3"/>

      <!-- Bottom (-) -->
      <circle cx="60" cy="475" r="3"/><circle cx="95" cy="475" r="3"/><circle cx="130" cy="475" r="3"/>
      <circle cx="165" cy="475" r="3"/><circle cx="200" cy="475" r="3"/><circle cx="235" cy="475" r="3"/>
      <circle cx="270" cy="475" r="3"/><circle cx="305" cy="475" r="3"/><circle cx="340" cy="475" r="3"/>
      <circle cx="375" cy="475" r="3"/><circle cx="410" cy="475" r="3"/><circle cx="445" cy="475" r="3"/>
      <circle cx="480" cy="475" r="3"/><circle cx="515" cy="475" r="3"/><circle cx="550" cy="475" r="3"/>
    </g>

    <!-- ================================================================= -->
    <!-- 3. COMPONENTES INSERTADOS EN LA PROTOBOARD -->
    <!-- ================================================================= -->

    <!-- CANAL 1: TRANSISTOR Q1 (BC547C) - COLUMNAS 8, 9, 10 -->
    <!-- Column 8 = Collector (C), Column 9 = Base (B), Column 10 = Emitter (E) -->
    
    <!-- Transistor Q1 (TO-92 Package) -->
    <g transform="translate(170, 270)">
      <!-- Legs into board -->
      <line x1="0" y1="0" x2="0" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="18" y1="0" x2="18" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="36" y1="0" x2="36" y2="40" stroke="#94a3b8" stroke-width="2.5"/>

      <!-- TO-92 Semi-Cylinder Plastic Body -->
      <path d="M -8 -25 C -8 -45, 44 -45, 44 -25 L 44 -5 L -8 -5 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <!-- Flat face indicator -->
      <line x1="-6" y1="-6" x2="42" y2="-6" stroke="#475569" stroke-width="2"/>
      <text x="18" y="-18" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">BC547C</text>
      <text x="18" y="-32" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Q1</text>
      
      <!-- Pin Labels -->
      <text x="0" y="52" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">1:C</text>
      <text x="18" y="52" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">2:B</text>
      <text x="36" y="52" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="bold">3:E</text>
    </g>

    <!-- Resistencia de Base RB1 (1 kΩ) -> Conectada a la Base (Pin 9) -->
    <g transform="translate(110, 310)">
      <!-- Leads -->
      <line x1="0" y1="0" x2="78" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <!-- Body -->
      <rect x="20" y="-8" width="38" height="16" fill="#d97706" rx="4" stroke="#78350f" stroke-width="1"/>
      <!-- Color Bands (1kΩ: Brown, Black, Red, Gold) -->
      <rect x="26" y="-8" width="4" height="16" fill="#78350f"/>
      <rect x="34" y="-8" width="4" height="16" fill="#000000"/>
      <rect x="42" y="-8" width="4" height="16" fill="#dc2626"/>
      <rect x="50" y="-8" width="4" height="16" fill="#fbbf24"/>
      <text x="39" y="-12" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold">RB1 (1kΩ)</text>
    </g>

    <!-- LED 1 (Rojo) -> Ánodo en Columna 8 (Colector Q1) y Cátodo a Resistencia 220Ω -->
    <g transform="translate(170, 140)">
      <!-- LED Bulb (Red) -->
      <circle cx="0" cy="0" r="16" fill="url(#ledRedGrad)" stroke="#fca5a5" stroke-width="1.5" filter="url(#glowRed)"/>
      <circle cx="-5" cy="-5" r="4" fill="#ffffff" opacity="0.6"/>
      <text x="0" y="-22" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">LED 1 (Rojo)</text>
      <!-- Anode / Cathode indicator -->
      <text x="-12" y="24" fill="#ef4444" font-size="9" font-weight="bold">+ (Ánodo)</text>
      <text x="5" y="24" fill="#94a3b8" font-size="9" font-weight="bold">- (Cátodo)</text>
    </g>

    <!-- Resistencia Limítrofe LED 1 (R1 = 220 Ω) -> Desde 5V Top Rail hasta Ánodo LED 1 -->
    <g transform="translate(150, 45) rotate(90)">
      <line x1="0" y1="0" x2="70" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <rect x="18" y="-8" width="34" height="16" fill="#d97706" rx="4" stroke="#78350f" stroke-width="1"/>
      <!-- Color Bands (220Ω: Red, Red, Brown, Gold) -->
      <rect x="23" y="-8" width="4" height="16" fill="#dc2626"/>
      <rect x="30" y="-8" width="4" height="16" fill="#dc2626"/>
      <rect x="37" y="-8" width="4" height="16" fill="#78350f"/>
      <rect x="44" y="-8" width="4" height="16" fill="#fbbf24"/>
      <text x="35" y="-12" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold" transform="rotate(-90 35 -12)">R1 (220Ω)</text>
    </g>


    <!-- CANAL 2: TRANSISTOR Q2 (BC547C) - COLUMNAS 22, 23, 24 -->
    <!-- Column 22 = Collector (C), Column 23 = Base (B), Column 24 = Emitter (E) -->

    <!-- Transistor Q2 (TO-92 Package) -->
    <g transform="translate(380, 270)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="18" y1="0" x2="18" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="36" y1="0" x2="36" y2="40" stroke="#94a3b8" stroke-width="2.5"/>

      <path d="M -8 -25 C -8 -45, 44 -45, 44 -25 L 44 -5 L -8 -5 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <line x1="-6" y1="-6" x2="42" y2="-6" stroke="#475569" stroke-width="2"/>
      <text x="18" y="-18" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">BC547C</text>
      <text x="18" y="-32" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="bold">Q2</text>

      <text x="0" y="52" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">1:C</text>
      <text x="18" y="52" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">2:B</text>
      <text x="36" y="52" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="bold">3:E</text>
    </g>

    <!-- Resistencia de Base RB2 (1 kΩ) -> Conectada a la Base de Q2 -->
    <g transform="translate(320, 310)">
      <line x1="0" y1="0" x2="78" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <rect x="20" y="-8" width="38" height="16" fill="#d97706" rx="4" stroke="#78350f" stroke-width="1"/>
      <rect x="26" y="-8" width="4" height="16" fill="#78350f"/>
      <rect x="34" y="-8" width="4" height="16" fill="#000000"/>
      <rect x="42" y="-8" width="4" height="16" fill="#dc2626"/>
      <rect x="50" y="-8" width="4" height="16" fill="#fbbf24"/>
      <text x="39" y="-12" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold">RB2 (1kΩ)</text>
    </g>

    <!-- LED 2 (Verde) -->
    <g transform="translate(380, 140)">
      <circle cx="0" cy="0" r="16" fill="url(#ledGreenGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#glowGreen)"/>
      <circle cx="-5" cy="-5" r="4" fill="#ffffff" opacity="0.6"/>
      <text x="0" y="-22" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">LED 2 (Verde)</text>
      <text x="-12" y="24" fill="#22c55e" font-size="9" font-weight="bold">+ (Ánodo)</text>
      <text x="5" y="24" fill="#94a3b8" font-size="9" font-weight="bold">- (Cátodo)</text>
    </g>

    <!-- Resistencia Limítrofe LED 2 (R2 = 220 Ω) -->
    <g transform="translate(360, 45) rotate(90)">
      <line x1="0" y1="0" x2="70" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <rect x="18" y="-8" width="34" height="16" fill="#d97706" rx="4" stroke="#78350f" stroke-width="1"/>
      <rect x="23" y="-8" width="4" height="16" fill="#dc2626"/>
      <rect x="30" y="-8" width="4" height="16" fill="#dc2626"/>
      <rect x="37" y="-8" width="4" height="16" fill="#78350f"/>
      <rect x="44" y="-8" width="4" height="16" fill="#fbbf24"/>
      <text x="35" y="-12" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold" transform="rotate(-90 35 -12)">R2 (220Ω)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 4. CABLES JUMPER COLORIDOS (CONEXIONES ENTRE ARDUINO Y PROTOBOARD) -->
  <!-- ================================================================= -->

  <!-- CABLE 1: Pin D2 Arduino -> Resistencia RB1 (Azul) -->
  <path d="M 251 260 C 290 260, 310 420, 470 420" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)"/>
  <circle cx="251" cy="260" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="470" cy="420" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>

  <!-- CABLE 2: Pin D3 Arduino -> Resistencia RB2 (Púrpura) -->
  <path d="M 251 280 C 310 280, 380 420, 680 420" fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)"/>
  <circle cx="251" cy="280" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
  <circle cx="680" cy="420" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>

  <!-- CABLE 3: 5V Arduino -> Riel Positivo (+) Protoboard (Rojo) -->
  <path d="M 251 480 C 300 480, 340 135, 420 135" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)"/>
  <circle cx="251" cy="480" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  <circle cx="420" cy="135" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>

  <!-- CABLE 4: GND Arduino -> Riel Negativo (-) Protoboard (Negro) -->
  <path d="M 251 510 C 290 510, 330 585, 420 585" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" filter="url(#dropShadow)"/>
  <circle cx="251" cy="510" r="5" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="420" cy="585" r="5" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>

  <!-- CABLE 5: Emisor Q1 -> GND Bottom Rail (Negro) -->
  <path d="M 566 310 L 566 585" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6 3"/>
  <circle cx="566" cy="310" r="4" fill="#000000"/>
  <circle cx="566" cy="585" r="4" fill="#000000"/>

  <!-- CABLE 6: Emisor Q2 -> GND Bottom Rail (Negro) -->
  <path d="M 776 310 L 776 585" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6 3"/>
  <circle cx="776" cy="310" r="4" fill="#000000"/>
  <circle cx="776" cy="585" r="4" fill="#000000"/>

  <!-- Leyenda de Cables -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="930" height="65" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="bold">GUÍA DE CABLES (JUMPERS):</text>
    
    <line x1="20" y1="45" x2="50" y2="45" stroke="#38bdf8" stroke-width="4"/>
    <text x="60" y="49" fill="#94a3b8" font-size="11">Pin D2 -> Resistencia RB1 (Base Q1)</text>

    <line x1="270" y1="45" x2="300" y2="45" stroke="#a855f7" stroke-width="4"/>
    <text x="310" y="49" fill="#94a3b8" font-size="11">Pin D3 -> Resistencia RB2 (Base Q2)</text>

    <line x1="520" y1="45" x2="550" y2="45" stroke="#ef4444" stroke-width="4"/>
    <text x="560" y="49" fill="#94a3b8" font-size="11">5V Arduino -> Riel + Protoboard</text>

    <line x1="750" y1="45" x2="780" y2="45" stroke="#334155" stroke-width="4"/>
    <text x="790" y="49" fill="#94a3b8" font-size="11">GND Arduino -> Riel - Protoboard</text>
  </g>
</svg>
