<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="arduinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878F"/>
      <stop offset="100%" stop-color="#005C62"/>
    </linearGradient>
    <linearGradient id="transistorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="475" y="40" text-anchor="middle" fill="#58a6ff" font-size="24" font-weight="bold">ESQUEMÁTICO DE CONMUTACIÓN DE TRANSISTORES BC547C</text>
  <text x="475" y="65" text-anchor="middle" fill="#8b949e" font-size="14">Control por Arduino - Intervalo: 1 segundo (1000 ms)</text>

  <!-- Grid lines subtle background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect x="20" y="80" width="910" height="540" fill="url(#grid)" rx="10" stroke="#30363d"/>

  <!-- ==================== ARDUINO UNO BOARD ==================== -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="180" height="380" rx="12" fill="url(#arduinoGrad)" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ARDUINO UNO</text>

    <!-- USB Port -->
    <rect x="-15" y="60" width="25" height="45" fill="#a0aec0" rx="3" stroke="#4a5568"/>
    <text x="-30" y="87" fill="#8b949e" font-size="10" transform="rotate(-90 -30 87)">USB</text>

    <!-- Power Rail + Pins -->
    <rect x="150" y="100" width="20" height="240" fill="#1a202c" rx="4"/>
    
    <!-- Pin 2 -->
    <circle cx="160" cy="140" r="5" fill="#38bdf8"/>
    <text x="140" y="144" text-anchor="end" fill="#ffffff" font-size="12" font-weight="bold">Pin D2</text>
    
    <!-- Pin 3 -->
    <circle cx="160" cy="200" r="5" fill="#a855f7"/>
    <text x="140" y="204" text-anchor="end" fill="#ffffff" font-size="12" font-weight="bold">Pin D3</text>

    <!-- 5V -->
    <circle cx="160" cy="260" r="5" fill="#ef4444"/>
    <text x="140" y="264" text-anchor="end" fill="#ffffff" font-size="12" font-weight="bold">5V</text>

    <!-- GND -->
    <circle cx="160" cy="300" r="5" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <text x="140" y="304" text-anchor="end" fill="#ffffff" font-size="12" font-weight="bold">GND</text>
  </g>

  <!-- ==================== POWER LINES (5V & GND) ==================== -->
  <!-- 5V Rail (Red) -->
  <path d="M 210 410 L 260 410 L 260 120 L 760 120" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="270" y="115" fill="#ef4444" font-size="12" font-weight="bold">+5V VCC</text>

  <!-- GND Rail (Black/Gray) -->
  <path d="M 210 450 L 240 450 L 240 560 L 760 560" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="250" y="555" fill="#94a3b8" font-size="12" font-weight="bold">GND (Masa Común)</text>

  <!-- Ground Symbols -->
  <g transform="translate(760, 560)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#94a3b8" stroke-width="3"/>
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#94a3b8" stroke-width="3"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-5" y1="25" x2="5" y2="25" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- ==================== RAMA 1: CANAL Q1 (LED ROJO) ==================== -->
  <!-- Cable Pin D2 -> RB1 -->
  <path d="M 210 290 L 320 290" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="235" y="282" fill="#38bdf8" font-size="11" font-weight="bold">Señal Q1 (HIGH/LOW)</text>

  <!-- Resistencia de Base RB1 (1kΩ) -->
  <g transform="translate(320, 275)">
    <rect x="0" y="0" width="60" height="30" fill="#d97706" rx="4" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bandas de color (1kΩ: Marrón, Negro, Rojo) -->
    <rect x="10" y="0" width="5" height="30" fill="#78350f"/>
    <rect x="22" y="0" width="5" height="30" fill="#000000"/>
    <rect x="34" y="0" width="5" height="30" fill="#dc2626"/>
    <rect x="46" y="0" width="5" height="30" fill="#d97706"/>
    <text x="30" y="-8" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">RB1 = 1 kΩ</text>
  </g>

  <!-- Cable RB1 -> Base Q1 -->
  <line x1="380" y1="290" x2="475" y2="290" stroke="#38bdf8" stroke-width="3"/>

  <!-- TRANSISTOR Q1 (BC547C) SÍMBOLO ESQUEMÁTICO -->
  <g transform="translate(450, 240)">
    <!-- Circulo contenedor -->
    <circle cx="50" cy="50" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Barra de Base -->
    <line x1="35" y1="30" x2="35" y2="70" stroke="#ffffff" stroke-width="4"/>
    <!-- Conexión Base -->
    <line x1="25" y1="50" x2="35" y2="50" stroke="#38bdf8" stroke-width="3"/>
    <text x="15" y="45" fill="#38bdf8" font-size="12" font-weight="bold">B</text>
    
    <!-- Colector -->
    <line x1="35" y1="38" x2="60" y2="20" stroke="#ffffff" stroke-width="3"/>
    <line x1="60" y1="20" x2="60" y2="0" stroke="#ffffff" stroke-width="3"/>
    <text x="68" y="15" fill="#ffffff" font-size="12" font-weight="bold">C</text>

    <!-- Emisor (con flecha NPN hacia afuera) -->
    <line x1="35" y1="62" x2="60" y2="80" stroke="#ffffff" stroke-width="3"/>
    <polygon points="60,80 48,72 54,64" fill="#ffffff"/>
    <line x1="60" y1="80" x2="60" y2="100" stroke="#ffffff" stroke-width="3"/>
    <text x="68" y="95" fill="#ffffff" font-size="12" font-weight="bold">E</text>

    <!-- Label Q1 -->
    <text x="50" y="-15" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">Q1: BC547C</text>
  </g>

  <!-- Conexión Emisor Q1 -> GND -->
  <path d="M 510 340 L 510 560" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <!-- LED 1 (Rojo) y Resistencia R_LED1 -->
  <!-- Conexión 5V -> R_LED1 -->
  <path d="M 510 120 L 510 140" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Resistencia R_LED1 (220 Ω) -->
  <g transform="translate(495, 140)">
    <rect x="0" y="0" width="30" height="50" fill="#d97706" rx="4" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bandas de color (220Ω: Rojo, Rojo, Marrón) -->
    <rect x="0" y="8" width="30" height="5" fill="#dc2626"/>
    <rect x="0" y="18" width="30" height="5" fill="#dc2626"/>
    <rect x="0" y="28" width="30" height="5" fill="#78350f"/>
    <rect x="0" y="38" width="30" height="5" fill="#d97706"/>
    <text x="-10" y="30" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="bold">R1 220Ω</text>
  </g>

  <!-- Conexión R_LED1 -> LED1 -->
  <line x1="510" y1="190" x2="510" y2="200" stroke="#ef4444" stroke-width="3"/>

  <!-- Símbolo LED 1 (Rojo) -->
  <g transform="translate(510, 220)">
    <!-- Triangulo LED -->
    <polygon points="-15,-15 15,-15 0,10" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" filter="url(#glowRed)"/>
    <!-- Linea de Cátodo -->
    <line x1="-15" y1="10" x2="15" y2="10" stroke="#ffffff" stroke-width="3"/>
    <!-- Flechas de Luz -->
    <line x1="18" y1="-10" x2="28" y2="-20" stroke="#ef4444" stroke-width="2"/>
    <polygon points="28,-20 22,-18 26,-14" fill="#ef4444"/>
    <line x1="22" y1="-2" x2="32" y2="-12" stroke="#ef4444" stroke-width="2"/>
    <polygon points="32,-12 26,-10 30,-6" fill="#ef4444"/>
    <text x="-25" y="0" fill="#ef4444" font-size="12" font-weight="bold">LED 1 (Rojo)</text>
  </g>
  <line x1="510" y1="230" x2="510" y2="240" stroke="#ef4444" stroke-width="3"/>

  <!-- ==================== RAMA 2: CANAL Q2 (LED VERDE) ==================== -->
  <!-- Cable Pin D3 -> RB2 -->
  <path d="M 210 350 L 290 350 L 290 450 L 600 450" fill="none" stroke="#a855f7" stroke-width="3"/>
  <text x="320" y="442" fill="#a855f7" font-size="11" font-weight="bold">Señal Q2 (HIGH/LOW)</text>

  <!-- Resistencia de Base RB2 (1kΩ) -->
  <g transform="translate(600, 435)">
    <rect x="0" y="0" width="60" height="30" fill="#d97706" rx="4" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="10" y="0" width="5" height="30" fill="#78350f"/>
    <rect x="22" y="0" width="5" height="30" fill="#000000"/>
    <rect x="34" y="0" width="5" height="30" fill="#dc2626"/>
    <rect x="46" y="0" width="5" height="30" fill="#d97706"/>
    <text x="30" y="-8" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">RB2 = 1 kΩ</text>
  </g>

  <!-- Cable RB2 -> Base Q2 -->
  <line x1="660" y1="450" x2="725" y2="450" stroke="#a855f7" stroke-width="3"/>

  <!-- TRANSISTOR Q2 (BC547C) SÍMBOLO ESQUEMÁTICO -->
  <g transform="translate(700, 400)">
    <circle cx="50" cy="50" r="35" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <line x1="35" y1="30" x2="35" y2="70" stroke="#ffffff" stroke-width="4"/>
    <line x1="25" y1="50" x2="35" y2="50" stroke="#a855f7" stroke-width="3"/>
    <text x="15" y="45" fill="#a855f7" font-size="12" font-weight="bold">B</text>
    
    <!-- Colector -->
    <line x1="35" y1="38" x2="60" y2="20" stroke="#ffffff" stroke-width="3"/>
    <line x1="60" y1="20" x2="60" y2="0" stroke="#ffffff" stroke-width="3"/>
    <text x="68" y="15" fill="#ffffff" font-size="12" font-weight="bold">C</text>

    <!-- Emisor -->
    <line x1="35" y1="62" x2="60" y2="80" stroke="#ffffff" stroke-width="3"/>
    <polygon points="60,80 48,72 54,64" fill="#ffffff"/>
    <line x1="60" y1="80" x2="60" y2="100" stroke="#ffffff" stroke-width="3"/>
    <text x="68" y="95" fill="#ffffff" font-size="12" font-weight="bold">E</text>

    <text x="50" y="-15" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">Q2: BC547C</text>
  </g>

  <!-- Conexión Emisor Q2 -> GND -->
  <path d="M 760 500 L 760 560" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <!-- LED 2 (Verde) y Resistencia R_LED2 -->
  <!-- Conexión 5V -> R_LED2 -->
  <path d="M 760 120 L 760 200" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Resistencia R_LED2 (220 Ω) -->
  <g transform="translate(745, 200)">
    <rect x="0" y="0" width="30" height="50" fill="#d97706" rx="4" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="0" y="8" width="30" height="5" fill="#dc2626"/>
    <rect x="0" y="18" width="30" height="5" fill="#dc2626"/>
    <rect x="0" y="28" width="30" height="5" fill="#78350f"/>
    <rect x="0" y="38" width="30" height="5" fill="#d97706"/>
    <text x="40" y="30" text-anchor="start" fill="#fbbf24" font-size="11" font-weight="bold">R2 220Ω</text>
  </g>

  <!-- Conexión R_LED2 -> LED2 -->
  <line x1="760" y1="250" x2="760" y2="280" stroke="#ef4444" stroke-width="3"/>

  <!-- Símbolo LED 2 (Verde) -->
  <g transform="translate(760, 310)">
    <polygon points="-15,-15 15,-15 0,10" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" filter="url(#glowGreen)"/>
    <line x1="-15" y1="10" x2="15" y2="10" stroke="#ffffff" stroke-width="3"/>
    <line x1="18" y1="-10" x2="28" y2="-20" stroke="#22c55e" stroke-width="2"/>
    <polygon points="28,-20 22,-18 26,-14" fill="#22c55e"/>
    <line x1="22" y1="-2" x2="32" y2="-12" stroke="#22c55e" stroke-width="2"/>
    <polygon points="32,-12 26,-10 30,-6" fill="#22c55e"/>
    <text x="40" y="0" fill="#22c55e" font-size="12" font-weight="bold">LED 2 (Verde)</text>
  </g>
  <line x1="760" y1="320" x2="760" y2="400" stroke="#22c55e" stroke-width="3"/>

  <!-- ==================== RECUADRO PINOUT BC547C ==================== -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="bold">PINOUT BC547C (TO-92)</text>
    <text x="90" y="38" text-anchor="middle" fill="#8b949e" font-size="10">(Vista cara plana frontal)</text>

    <!-- Transistor Graphic -->
    <path d="M 65 50 Q 90 40 115 50 L 115 80 L 65 80 Z" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    <!-- Pins -->
    <line x1="75" y1="80" x2="75" y2="105" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="90" y1="80" x2="90" y2="105" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="105" y1="80" x2="105" y2="105" stroke="#e2e8f0" stroke-width="2"/>

    <text x="75" y="115" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">1:C</text>
    <text x="90" y="115" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">2:B</text>
    <text x="105" y="115" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">3:E</text>
  </g>
</svg>
