<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Horarios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f4f4f8; color: #222; }
        h1, h2 { margin-bottom: 8px; }
        .schedule-row { display: grid; grid-template-columns: 140px 120px 200px 100px; gap: 12px; align-items: center; margin-bottom: 12px; }
        label { font-weight: 600; }
        select, input[type="time"], input[type="text"] { width: 100%; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; background: white; }
        .actions { margin: 18px 0; }
        button { padding: 10px 16px; border: none; border-radius: 5px; background: #2563eb; color: white; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .output { white-space: pre-wrap; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin-top: 16px; }
        .row-header { display: grid; grid-template-columns: 140px 120px 200px 100px; gap: 12px; font-size: 0.9rem; font-weight: 700; color: #444; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Editor de Horarios de Alarma</h1>
    <p>Modifica los días y horas de cada alarma. Los datos se guardan localmente y se exponen como variables para un Arduino.</p>

    <div class="row-header">
        <div>Mensaje</div>
        <div>Día</div>
        <div>Hora</div>
        <div>Activo</div>
    </div>

    <form id="scheduleForm">
        <div id="scheduleRows"></div>
    </form>

    <div class="actions">
        <button type="button" id="saveBtn">Guardar horarios</button>
        <button type="button" id="resetBtn" style="margin-left: 12px; background: #6b7280;">Restaurar predeterminado</button>
    </div>

    <h2>Variables generadas</h2>
    <div class="output" id="outputVariables"></div>

    <script src="prueba1.js"></script>
</body>
</html>
